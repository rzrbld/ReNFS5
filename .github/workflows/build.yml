# Build the ReNFS5 PortMaster package (engine + launcher) on every push; a `portmaster-v*` tag also
# publishes it as a pre-release with packaging/RELEASE_NOTES.md as the notes.
name: Build

on:
  push:
    branches: [main]
    tags: ['portmaster-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: docker/setup-buildx-action@v3

      - name: Cross image (Debian bullseye, aarch64)
        uses: docker/build-push-action@v6
        with:
          context: packaging
          file: packaging/Dockerfile.portmaster-cross
          tags: nfs5-pm-cross:bullseye
          load: true
          cache-from: type=gha,scope=pm-cross
          cache-to: type=gha,mode=max,scope=pm-cross

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            build/cargo-registry
            engine/target-pm
          key: engine-${{ hashFiles('engine/Cargo.lock', 'packaging/Dockerfile.portmaster-cross') }}-${{ github.sha }}
          restore-keys: |
            engine-${{ hashFiles('engine/Cargo.lock', 'packaging/Dockerfile.portmaster-cross') }}-

      - name: Build package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/portmaster-* ]]; then
            version="${GITHUB_REF_NAME#portmaster-}"
          else
            version="v$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          fi
          bash scripts/ci_build.sh "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: nfs5-portmaster
          path: |
            build/package-out/nfs5.zip
            build/package-out/nfs5.zip.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/portmaster-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          engine=$(git -C engine rev-parse HEAD)
          sha=$(cut -d' ' -f1 build/package-out/nfs5.zip.sha256)
          {
            cat packaging/RELEASE_NOTES.md
            echo
            echo "Source: https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
            echo "Engine source: https://github.com/rzrbld/Open-Unleashed/tree/${engine} (fork of https://github.com/Second-Boot/Open-Unleashed)"
            echo "ZIP SHA-256: \`${sha}\`"
          } > "$RUNNER_TEMP/notes.md"
          title=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")
          [ -n "$title" ] && [ "$title" != "$(git log -1 --format=%s)" ] || title="ReNFS5: Open Unleashed — ${GITHUB_REF_NAME#portmaster-}"
          gh release create "$GITHUB_REF_NAME" build/package-out/nfs5.zip build/package-out/nfs5.zip.sha256 \
            --prerelease --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
